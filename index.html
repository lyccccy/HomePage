<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Felix Liao 的个人主页。专注于人工智能、系统架构与人机交互设计。">
    <title>Felix Liao | System Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&family=Lora:wght@400;500&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    
    <style>
        :root {
            /* Claude 配色 */
            --bg: #F9F6F1; 
            --text-main: #1D1917;
            --text-secondary: #66605C;
            --accent: #D97757;
            --border: rgba(29, 25, 23, 0.1);
            
            /* 你指定的等宽字体栈 */
            --font-mono: "Fira Code", "Fira Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
            /* 标题保留一点衬线质感，更像 Claude */
            --font-serif: "STIX Two Text", "Lora", "Georgia", serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            /* 将全局字体切换为你指定的等宽字体 */
            font-family: var(--font-mono);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 850px;
            width: 100%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 500;
            /* 强制全大写，增加仪式感 */
            text-transform: uppercase;
        }

        h1 {
            font-family: var(--font-serif); /* 名字保留衬线，体现人文气息 */
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 450;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            line-height: 1.1;
        }

        .description {
            /* 描述部分使用等宽字体，像是在编辑器里写代码 */
            font-family: var(--font-mono);
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: var(--text-main);
            line-height: 1.7;
            margin-bottom: 4rem;
            min-height: 3.4em; /* 防止打字时页面跳动 */
        }

        /* 导航部分 */
        nav {
            display: flex;
            gap: 2.5rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: all 0.2s ease;
            position: relative;
        }

        /* 悬停效果：从 Claude 的下划线改为更硬核的方块感 */
        nav a:hover {
            color: var(--text-main);
        }
        
        nav a::before {
            content: "> "; /* 模拟终端提示符 */
            opacity: 0;
            position: absolute;
            left: -1.2rem;
            transition: opacity 0.2s ease;
        }

        nav a:hover::before {
            opacity: 1;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 1rem;
            }
            .description {
                font-size: 1rem;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="status">v2.0.26 / Ready</div>
        <h1 id="name-heading">Felix Liao</h1>
        
        <div class="description">
            <span id="typewriter"></span>
        </div>

        <nav>
            <a href="#">[01] Projects</a>
            <a href="#">[02] Research</a>
            <a href="#">[03] Thoughts</a>
            <a href="mailto:hello@felixliao.com">[04] Contact</a>
        </nav>
    </div>

    <script>
        const app = document.getElementById('typewriter');

        const typewriter = new Typewriter(app, {
            loop: true,
            delay: 40,
            cursor: '▊' // 经典的终端光标
        });

        typewriter
            .typeString('Building thoughtful systems...')
            .pauseFor(2000)
            .deleteAll(20)
            .typeString('Human-centered AI architecture.')
            .pauseFor(2000)
            .deleteAll(20)
            .typeString('At the intersection of design & code.')
            .pauseFor(2000)
            .start();
    </script>
</body>
</html>
